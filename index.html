<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>WP Design | Automatización Industrial</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<style>
html{
    scroll-behavior:smooth;
}

/* RESET PRO */
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0b1120;
    color:white;
}

/* NAV PRO */
nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:20px 40px;
    display:flex;
    justify-content:center;
    align-items:center;
    z-index:1000;
    background:transparent;
    transition:all 0.3s ease;
}

nav.scrolled{
    background:rgba(0,0,0,0.85);
    backdrop-filter:blur(8px);
    padding:12px 40px;
    box-shadow:0 5px 20px rgba(0,0,0,0.5);
}

.logo{
    position:absolute;
    left:20px;
    height:45px;
    transition:0.3s;
}

nav.scrolled .logo{
    height:38px;
}

.menu{
    display:flex;
    align-items:center;
    gap:30px;
}

.menu a{
    color:white;
    text-decoration:none;
    position:relative;
}

.menu a::after{
    content:'';
    position:absolute;
    width:0;
    height:2px;
    background:#25D366;
    left:0;
    bottom:-6px;
    transition:0.3s;
}

.menu a:hover::after{
    width:100%;
}

.hamburger{
    position:absolute;
    right:25px;
    display:none;
    font-size:25px;
    cursor:pointer;
}

.dropdown{
    position:relative;
}

.dropdown-toggle{
    cursor:pointer;
}

.dropdown-toggle i{
    margin-left:5px;
    transition:0.3s;
}

.dropdown.active .dropdown-toggle i{
    transform:rotate(180deg);
}

.mega-menu{
    position:absolute;
    top:60px;
    left:0;
    width:90vw;
    max-width:750px;
    background:rgba(10,10,10,0.95);
    backdrop-filter:blur(10px);
    padding:30px;
    display:flex;
    gap:40px;
    border-radius:12px;
    border-top:3px solid #25D366;
    box-shadow:0 20px 50px rgba(0,0,0,0.7);
    opacity:0;
    transform:translateY(15px);
    pointer-events:none;
    transition:0.3s;
}

.dropdown.active .mega-menu{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

.mega-column{
    display:flex;
    flex-direction:column;
}

.mega-column h4{
    color:#25D366;
    margin-bottom:12px;
}

.mega-column a{
    display:flex;
    align-items:center;
    gap:10px;
    padding:6px 0;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.mega-column a:hover{
    color:#25D366;
    transform:translateX(5px);
}

.mega-column i{
    color:#25D366;
    width:20px;
}

/* HERO */
.hero{
    position:relative;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    text-align:center;
    overflow:hidden;
}

.hero::after{
    content:"";
    position:absolute;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.55);
    top:0;
    left:0;
    z-index:-1;
}

#videoHero{
    position:absolute;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:-2;
}

.hero h1{
    font-size:2.5rem;
    margin-bottom:10px;
}

.hero p{
    font-size:1.2rem;
    opacity:0.9;
}

/* ABOUT */
.about{
    padding:80px 40px;
    background:#0f172a;
    text-align:center;
}

.about-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    margin-top:30px;
}

.about-card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
}

/* PROYECTOS */
.projects{
    padding:80px 40px;
    background:#020617;
    text-align:center;
}

.projects-grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(300px,1fr));
    gap:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    transition:0.3s;
}

.card:hover{
    transform:translateY(-5px);
}

.card img{
    width:100%;
    border-radius:10px;
}

/* CLIENTES */
.clientes{
    padding:80px 40px;
    text-align:center;
}

.logos{
    display:flex;
    flex-wrap:wrap;
    gap:40px;
    justify-content:center;
}

.logos img{
    width:120px;
    background:white;
    padding:10px;
    border-radius:10px;
}

/* WHATSAPP PRO */
.whatsapp{
    position:fixed;
    right:20px;
    bottom:20px;
    background:#25D366;
    padding:12px 18px;
    border-radius:50px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:14px;
    font-weight:bold;
    color:white;
    text-decoration:none;
    box-shadow:0 8px 20px rgba(0,0,0,0.4);
    transition:0.3s;
    z-index:999;
    animation:pulse 2s infinite;
}

.whatsapp i{
    font-size:18px;
}

.whatsapp:hover{
    transform:scale(1.1);
}

.whatsapp2{
    bottom:80px;
    background:#128C7E;
}

@keyframes pulse{
    0%{ transform:scale(1); }
    50%{ transform:scale(1.08); }
    100%{ transform:scale(1); }
}

/* RESPONSIVE */
@media(max-width:900px){

.menu{
    position:absolute;
    top:70px;
    left:0;
    width:100%;
    background:black;
    flex-direction:column;
    display:none;
    padding:20px;
}

.menu.active{
    display:flex;
}

.hamburger{
    display:block;
}

.mega-menu{
    position:static;
    width:100%;
    flex-direction:column;
}

.mega-menu{
    display:none;
}

.dropdown.active .mega-menu{
    display:flex;
}

.logo{
    height:35px;
}
}
</style>
</head>

<body>

<nav>
<img src="logo.png" class="logo">

<div class="hamburger" id="hamburger">☰</div>

<div class="menu" id="menu">

<a href="#">Inicio</a>
<a href="#nosotros">Nosotros</a>

<div class="dropdown" id="dropdown">
<div class="dropdown-toggle">

<div class="mega-menu">
<div class="mega-column">
<h4>Ingeniería</h4>

<a href="mantenimiento.html">Mantenimiento</a>
<a href="programacion-de-robots.html">Programación de robots</a>
</div>
</div>
</div>

</div>
</nav>

<section class="hero">
<video autoplay muted loop playsinline id="videoHero">
<source src="video.mp4" type="video/mp4">
</video>

<div>
<h1>WP Design - Automatización Industrial</h1>
<p>Soluciones industriales para optimizar tus procesos.</p>
</div>
</section>

</body>
</html>
